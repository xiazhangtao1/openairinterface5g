# Default values for oai-gnb.

replicaCount: 1

image:
  repository: oaisoftwarealliance/oai-gnb
  tag: develop
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

securityContext:
  privileged: true
  capabilities:
    drop:
      - ALL

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  rfsim:
    port: 4043
    protocol: TCP
  ngu:
    port: 2152
    protocol: UDP

hostNetwork: false
dnsPolicy: ClusterFirst

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

config:
  activeGnb: gnb-rfsim
  asn1Verbosity: none
  gnbId: "0xe00"
  gnbName: gnb-rfsim
  trackingAreaCode: 1
  nrCellId: "12345678"
  minRxTxTime: 6

plmn:
  mcc: "460"
  mnc: "11"
  mncLength: 2
  sst: 1
  sd: "0x010101"

cell:
  physCellId: 0
  absoluteFrequencySsb: 621312
  dlAbsoluteFrequencyPointA: 620040
  dlFrequencyBand: 78
  ulFrequencyBand: 78
  subcarrierSpacing: 1
  carrierBandwidth: 106
  initialBwpLocationAndBandwidth: 28875
  initialDlBwpControlResourceSetZero: 11
  initialDlBwpSearchSpaceZero: 0
  prachMsg1Fdm: 1
  prachZeroCorrelationZoneConfig: 12
  preambleReceivedTargetPower: -104
  ssbPerRachOccasionAndCbPreamblesPerSsb: 15
  ssbPositionsInBurstBitmap: 2
  ssbBlockPower: -25

amf:
  ip: 192.168.71.132

network:
  # "__POD_IP__" is replaced at container start with status.podIP. Override it
  # for deployments that need to advertise another routable N2/N3 address.
  n2Address: __POD_IP__
  n3Address: __POD_IP__
  nguPort: 2152

rfsimulator:
  enabled: true
  serveraddr: server

ru:
  nbTx: 1
  nbRx: 1
  attTx: 0
  attRx: 0
  maxPdschReferenceSignalPower: -27
  maxRxgain: 75
  sdrAddrs: serial=XXXXXXX

security:
  cipheringAlgorithms:
    - nea0
  integrityAlgorithms:
    - nia2
    - nia0
  drbCiphering: true
  drbIntegrity: false

log:
  global: info
  hw: info
  phy: info
  mac: info
  rlc: info
  pdcp: info
  rrc: info
  ngap: debug
  f1ap: debug

additionalOptions:
  - -E
  - --rfsim
  - --log_config.global_log_options
  - level,nocolor,time
